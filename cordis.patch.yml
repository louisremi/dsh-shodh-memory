# @louisremi/dsh-shodh-memory — bundle patch layer.
#
# Applied over the profile's existing entry list when this package is added with
# `dsh plugin add <this-package>`. Later layers (another bundle, or the user's
# own `$DSH_HOME/cordis.patch.yml`) may retarget this row by `id` to override
# any field below; a patch replaces the whole `config`, so restate every field
# you keep.
#
# Every value here is a default. The plugin degrades to a no-op when the shodh
# server is unreachable, so this row is safe to ship enabled.
#
# ── connection ───────────────────────────────────────────────────────────────
#   baseUrl         shodh HTTP root. Override with SHODH_API_URL.
#   apiKeyEnv       NAME of the env var holding the X-API-Key value.
#                 shodh generates a local key on `shodh init`.
#   userId          shodh tenant namespace. Override with SHODH_USER_ID.
#   userIdScope     'global'    — one tenant for the whole harness (default):
#                                 every session, workspace and profile sharing
#                                 this userId reads and writes the same memory.
#                   'workspace' — `dsh-<basename(harness cwd)>`, resolved once
#                                 at startup, so harnesses started from
#                                 different directories get different tenants.
#                                 The Web app serves every workspace from one
#                                 process, so its workspaces share that tenant.
#
# ── resilience ───────────────────────────────────────────────────────────────
#   requestTimeoutMs  default per-call budget.
#   recallTimeoutMs   tighter budget for the inline auto-recall: it sits on the
#                     critical path of a turn, so it must fail fast.
#   captureTimeoutMs  background capture budget; never blocks a turn.
#   failureThreshold  consecutive failures that trip the circuit breaker.
#   failureCooldownMs how long the breaker stays open before a probe is allowed.
#
# ── model-facing tools ───────────────────────────────────────────────────────
# Each toggle adds or removes ONE tool schema from every request. Three tools
# cost roughly 350 tokens of standing context; shodh's own MCP surface exposes
# 51 of them for ~7.5k. Turn off what you do not use.
#   searchResultMaxChars  per-result cap on `memory_search` output. 0 (default)
#                     returns the full stored text. Those results were requested
#                     and `limit` already bounds them; clipping them to the
#                     recall block's budget is what made the tool unable to
#                     answer "what did that memory actually say". The always-on
#                     block is the real budget — see autoRecall.maxChars.
#
# ── auto-recall ──────────────────────────────────────────────────────────────
#   enabled         inject relevant memories at the start of each turn.
#   maxChars        hard cap on the injected block. This is the main
#                 token-cost control: 1200 chars ≈ 300 tokens.
#   maxResults    ceiling on memories surfaced per turn.
#   minPromptChars  skip recall for prompts too short to mean anything
#                 ("ok", "continue", "hi").
#   reuseGapTurns   a memory injected at turn N is not re-injected until
#                 turn N+gap, so the same fact is not paid for twice while
#                 it is still in context.
#   queryChars    how much of the user's prompt is sent as the query.
#
# ── auto-capture ─────────────────────────────────────────────────────────────
# Runs off session events. Costs the model zero tokens.
#   userPrompts       store each human prompt.
#   toolErrors        store failed tool calls as `Error` memories — the
#                   highest-value automatic signal in a coding harness.
#   assistantReplies store assistant output. Off: high volume, low signal.
#   maxChars          per-memory cap before the write is skipped.
#   minChars          prompts below this are noise; not stored.
#
# ── prompt section ───────────────────────────────────────────────────────────
#   promptSection   add the short "how to use memory" system-prompt section.
#                 ~140 tokens. Turning it off leaves the tools self-describing.
#
# ── on-demand cleanup ────────────────────────────────────────────────────────
# `/shodh cleanup` reads the store through an LLM and PROPOSES merges and
# deletions; nothing is written until `/shodh cleanup apply`. Costs nothing and
# changes nothing until a human runs the command.
#   maxMemories     newest memories the scan covers. The analysis reads them
#                   newest-first and drops the oldest lines when the input
#                   budget is tighter than the scan.
#   maxFetches      cap on per-memory GETs used to replace truncated list
#                   previews with full text, newest first. 0 = analyze the
#                   previews as-is; a memory left truncated can still be
#                   proposed for deletion but never merged.
#   maxInputBytes   hard budget for the corpus sent to the model.
#   maxOutputTokens   the model's output cap; proposals are short JSONL.
#   timeoutMs       wall-clock budget for the whole pass (list, fetches, model),
#                   and separately for each `apply`.
#   provider/model  pin a route; unset uses the profile's first registered
#                   provider and its first model.
#
# ── TUI ──────────────────────────────────────────────────────────────────────
# `/shodh tui` runs upstream's `shodh-tui` binary in a right-sidebar terminal.
# Web and Desktop only; adds no tool and no prompt text, so it costs no tokens.
#   enabled         false makes `/shodh tui` report that it is switched off.
#   path            absolute path to a `shodh-tui` binary. Empty: the copy
#                 `/shodh tui install` downloaded, then `shodh-tui` on PATH.
#   version         release tag to install and prefer (e.g. v0.2.0). Empty:
#                 the version the server reports on /health.
#   cols, rows      initial grid; the sidebar refits it to the panel.

- insert:
    - id: shodh-memory
      name: '@louisremi/dsh-shodh-memory'
      config:
        baseUrl: !!js process.env.SHODH_API_URL ?? 'http://127.0.0.1:3030'
        apiKeyEnv: SHODH_API_KEY
        userId: !!js process.env.SHODH_USER_ID ?? 'dsh'
        userIdScope: global

        requestTimeoutMs: 3000
        recallTimeoutMs: 1500
        captureTimeoutMs: 4000
        failureThreshold: 3
        failureCooldownMs: 30000

        tools:
          save: true
          search: true
          forget: true
          # 0 = a search result carries the full stored text; `limit` is the budget.
          searchResultMaxChars: 0

        autoRecall:
          enabled: true
          maxChars: 1200
          maxResults: 5
          minPromptChars: 12
          reuseGapTurns: 8
          queryChars: 500

        autoCapture:
          enabled: true
          userPrompts: true
          toolErrors: true
          assistantReplies: false
          maxChars: 900
          minChars: 24

        promptSection: true

        cleanup:
          maxMemories: 200
          maxFetches: 40
          maxInputBytes: 120000
          maxOutputTokens: 4000
          timeoutMs: 45000
          # provider: anthropic
          # model: claude-sonnet-4-5

        tui:
          enabled: true
          path: ''
          version: ''
          cols: 120
          rows: 36
