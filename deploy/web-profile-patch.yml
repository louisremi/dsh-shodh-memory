# Example patch layer for a dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# Copy the entries you need into your profile's `cordis.patch.yml`.

# NOTE: an MCP server with a large tool surface belongs in its own profile,
# not in the one used for coding. 78 tool definitions is ~64,800 tokens (~25%
# of a 262k context window) on every request, so boot that server under a
# separate profile and switch to it only when you work with it.

# Point the shodh-memory plugin at the shodh-memory compose service instead of
# the bundle default of 127.0.0.1:3030.
#
# IMPORTANT — a patch REPLACES the whole `config` block of the row it targets,
# it does not deep-merge. So every field you want kept must be restated here;
# anything omitted falls back to the plugin's own normalizeConfig() defaults in
# src/config.js, not to the bundle's values. See the bundle layer in
# '@louisremi/dsh-shodh-memory'/cordis.patch.yml for what each field does.
#
# The API key is read from the SHODH_API_KEY env var (set in the DSH
# container's environment, ideally from a .env file). `apiKeyEnv` names that
# variable; the plugin never sees the key in config.
- id: shodh-memory
  config:
    # Reachable by compose service name, which is what services in one compose
    # file resolve each other by. Loopback would be the DSH container itself.
    # Do not put a published hostname (reverse proxy, tailnet) here: it would
    # expose a store that holds every prompt.
    baseUrl: http://shodh-memory:3030
    apiKeyEnv: SHODH_API_KEY

    # Tenant for this container's memory. The bundle default is 'global': one
    # tenant (`dsh`) for everything pointed at the server with that userId.
    # 'workspace' derives the tenant from the harness container's working
    # directory (`dsh-<dirname>`) once at startup — stable for a container, but
    # shared by every workspace it serves, because the Web app runs them all in
    # one process. Keep 'workspace' if this deployment already stores memories
    # under `dsh-<dirname>`; otherwise drop the line to use the default.
    userIdScope: workspace

    requestTimeoutMs: 3000
    recallTimeoutMs: 1500
    captureTimeoutMs: 4000
    failureThreshold: 3
    failureCooldownMs: 30000

    tools:
      save: true
      search: true
      forget: true

    autoRecall:
      enabled: true
      maxChars: 1200
      maxResults: 5
      minPromptChars: 12
      reuseGapTurns: 8
      queryChars: 500

    autoCapture:
      enabled: true
      userPrompts: true
      toolErrors: true
      assistantReplies: false
      maxChars: 900
      minChars: 24

    promptSection: true
