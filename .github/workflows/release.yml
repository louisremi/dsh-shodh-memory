name: Release

# Push a `v*` tag to cut a release:
#   git tag v0.3.0 && git push origin v0.3.0
# The release body is generated from the commit history since the previous
# tag. Publication happens in this same workflow, chained after the release:
# GitHub's recursion guard means events created by GITHUB_TOKEN (like a
# release created here) do NOT trigger other workflows, so `on: release` in
# publish.yml can never see automation-cut releases. publish.yml remains the
# path for human-published releases and the recovery lever for this chain.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Test (builds dist/)
        run: pnpm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
