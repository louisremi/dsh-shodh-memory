name: Release

# Push a `v*` tag to cut a release:
#   git tag v0.3.0 && git push origin v0.3.0
# The release body is generated from the commit history since the previous
# tag. Publication happens in this same workflow, chained after the release:
# GitHub's recursion guard means events created by GITHUB_TOKEN (like a
# release created here) do NOT trigger other workflows, so `on: release` in
# publish.yml can never see automation-cut releases. publish.yml remains the
# path for human-published releases and the recovery lever for this chain.
#
# npm publication uses Trusted Publishing (OIDC): id-token: write below, and
# `@louisremi/dsh-shodh-memory` registered on npmjs.com with this repo and
# workflow file as a trusted publisher. There is no NPM_TOKEN secret — do
# not add one.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Test (builds dist/)
        run: pnpm test

      - name: Release tag must match package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match package.json version '$version'" >&2
            exit 1
          fi

      - name: package.json repository must match this repo
        run: |
          url="$(node -p "require('./package.json').repository?.url || ''")"
          if [ "$url" != "git+https://github.com/${GITHUB_REPOSITORY}.git" ]; then
            echo "package.json repository.url '$url' != 'git+https://github.com/${GITHUB_REPOSITORY}.git' — npm would reject the provenance bundle with E422" >&2
            exit 1
          fi

      - name: Check whether the version is already on npm
        id: needs-publish
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already in the registry; skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.needs-publish.outputs.publish == 'true'
        name: Publish to npm (Trusted Publishing / OIDC)
        run: npm publish --provenance --access public
