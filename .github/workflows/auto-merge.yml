name: Dependabot auto-merge

# dependabot.yml has no automerge option; GitHub does this through the repo's
# auto-merge feature (Settings > General > Allow auto-merge, which is on).
# This queues development-dependency PRs for squash-merge once CI passes;
# branch protection - required `check`, up-to-date branch, resolved
# conversations - still decides when they land. Actions bumps and any
# direct:production change, e.g. the @deepseek-ai/cordis peer range, are left
# for a human: they touch the publish pipeline or what consumers install.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'louisremi/dsh-shodh-memory'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Queue development-dependency PRs for auto-merge
        if: steps.metadata.outputs.dependency-type == 'direct:development'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
