name: Publish

# npm publication for releases NOT cut through release.yml. A human editing
# a release in the UI fires `release: published` and lands here; releases
# created by CI publish inside release.yml itself (GitHub does not fire
# `release` events for releases created with GITHUB_TOKEN).
#
# workflow_dispatch is the recovery lever: after fixing whatever failed,
# publish any released tag with
#   gh workflow run publish.yml -f tag=v0.3.0
# Re-running is safe: the guards below reject a tag/version mismatch and
# skip a version the registry already carries.
#
# npm publication uses Trusted Publishing (OIDC): id-token: write below, and
# `@louisremi/dsh-shodh-memory` registered on npmjs.com with this repo and
# workflow file as a trusted publisher. There is no NPM_TOKEN secret — do
# not add one.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.3.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Test (builds dist/)
        run: pnpm test

      - name: Release tag must match package.json version
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag '$TAG' does not match package.json version '$version'" >&2
            exit 1
          fi

      - name: package.json repository must match this repo
        run: |
          url="$(node -p "require('./package.json').repository?.url || ''")"
          if [ "$url" != "git+https://github.com/${GITHUB_REPOSITORY}.git" ]; then
            echo "package.json repository.url '$url' != 'git+https://github.com/${GITHUB_REPOSITORY}.git' — npm would reject the provenance bundle with E422" >&2
            exit 1
          fi

      - name: Check whether the version is already on npm
        id: needs-publish
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already in the registry; skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.needs-publish.outputs.publish == 'true'
        name: Publish to npm (Trusted Publishing / OIDC)
        run: npm publish --provenance --access public
