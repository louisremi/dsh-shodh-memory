name: Release

# ONE publishing workflow, deliberately. npm Trusted Publishing binds an OIDC
# identity to a workflow *filename*: `@louisremi/dsh-shodh-memory` is
# registered on npmjs.com for `publish.yml`, so a publish job in another file
# gets npm's generic 404 on PUT. Keep every path that publishes in this file,
# and keep the filename — renaming it silently breaks releases.
#
# Cut a release by pushing a `v*` tag:
#   git tag v0.3.0 && git push origin v0.3.0
# That run creates the GitHub release with notes generated from the commits
# since the previous tag, then publishes to npm with provenance.
#
# Two other triggers share the file:
#  - `release: published` publishes a release a human cut by hand. Releases
#    created by this workflow use GITHUB_TOKEN, and GitHub's recursion guard
#    means they do not fire `release` events again.
#  - `workflow_dispatch` is the recovery lever: after fixing whatever failed,
#    replay a tag with
#      gh workflow run publish.yml -f tag=v0.3.0
#    It only publishes; it never creates a release.
#
# Publication uses Trusted Publishing (OIDC), so there is no NPM_TOKEN secret
# — do not add one.

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.3.0)
        required: true
        type: string

permissions:
  contents: read

env:
  # The tag this run is about: the pushed tag, the published release's tag, or
  # the dispatch input.
  TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    # Only tag pushes create a release; the other triggers publish one that
    # already exists.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retrying a tag run must not fail because the release already exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping its notes."
          else
            gh release create "$TAG" --generate-notes
          fi

  publish:
    needs: release
    # The release job is skipped for `release` and `workflow_dispatch` runs;
    # always() keeps this job eligible there. On tag pushes it still waits for
    # a successful release.
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Test (builds dist/)
        run: pnpm test

      - name: Release tag must match package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag '$TAG' does not match package.json version '$version'" >&2
            exit 1
          fi

      - name: package.json repository must match this repo
        run: |
          url="$(node -p "require('./package.json').repository?.url || ''")"
          if [ "$url" != "git+https://github.com/${GITHUB_REPOSITORY}.git" ]; then
            echo "package.json repository.url '$url' != 'git+https://github.com/${GITHUB_REPOSITORY}.git' — npm would reject the provenance bundle with E422" >&2
            exit 1
          fi

      - name: Check whether the version is already on npm
        id: needs-publish
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already in the registry; skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.needs-publish.outputs.publish == 'true'
        name: Publish to npm (Trusted Publishing / OIDC)
        run: npm publish --provenance --access public
