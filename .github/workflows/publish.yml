name: Publish

# npm publication for releases NOT cut through release.yml. A human editing
# a release in the UI fires `release: published` and lands here; releases
# created by CI publish inside release.yml itself (GitHub does not fire
# `release` events for releases created with GITHUB_TOKEN).
#
# workflow_dispatch is the recovery lever: after fixing whatever failed
# (e.g. adding the NPM_TOKEN secret), publish any released tag with
#   gh workflow run publish.yml -f tag=v0.2.3
#
# Requires the NPM_TOKEN repo secret (npm access token, Automation kind).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.2.3)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Test (builds dist/)
        run: pnpm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
